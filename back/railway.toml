[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build && (npm run geo:ensure-iecm-uts || true)"

[deploy]
# Solo migraciones en cada deploy. Catálogos electorales: `railway run npm run electoral:seed-db` cuando cambien JSON.
preDeployCommand = "npx prisma migrate deploy"
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Fotos: servicio Control → Volumes → montar en /app/uploads (≥5 GB recomendado).
# Variable: UPLOAD_DIR=/app/uploads
# Si aparece ENOSPC, ampliar el volumen o liberar archivos viejos en /app/uploads.
