[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build && (npm run geo:ensure-iecm-uts || true)"

[deploy]
# Solo migraciones en cada deploy. Catálogos electorales: `railway run npm run electoral:seed-db` cuando cambien JSON.
preDeployCommand = "npx prisma migrate deploy"
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Persistencia de fotos: en Railway Dashboard → servicio Control → Volumes
# Montar volumen en /app/uploads (ruta usada por multer y express.static).
